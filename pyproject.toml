[project]
name = "agentic-rag-for-dummies"
version = "2.3.1"
description = "A modular Agentic RAG built with LangGraph — learn Retrieval-Augmented Generation Agents in minutes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastembed==0.9.0",
    "gradio==6.30.0",
    "ipykernel==7.4.0",
    "langchain-huggingface==1.2.3",
    "langchain-ollama==1.1.0",
    "langchain-qdrant==1.1.0",
    "langchain-text-splitters==1.1.3",
    "langfuse==5.0.2",
    "langgraph==1.2.16",
    "matplotlib==3.11.2",
    "pymupdf4llm==1.28.2",
    "python-dotenv==1.2.4",
    "ragas==0.4.3",
    "seaborn==0.13.2",
    "sentence-transformers==6.1.0",
    "tiktoken==0.14.0",
]

[tool.uv]
package = false
